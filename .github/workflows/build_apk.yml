name: 'Build Floating Multi-Tab Kiwi APK'

on:
  push:
    branches:
      - kiwi
      - master
      - main
  pull_request:
    branches:
      - kiwi
      - master
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build chrome_public_apk
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space (Aggressive Runner Cleanup)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /var/lib/docker
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Build Tools and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python-is-python3 \
            ninja-build \
            bison \
            gperf \
            pkg-config \
            libglib2.0-dev \
            libncurses5 \
            libxml2-dev \
            libxslt-dev \
            unzip \
            curl \
            git

      - name: Install Official Standalone GN Binary & depot_tools
        run: |
          # Download Google's standalone native GN binary
          curl -sL https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -o gn.zip
          sudo unzip -o gn.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/gn
          /usr/local/bin/gn --version

          # Clone depot_tools for auxiliary tools and scripts
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools

          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch Missing Chromium Build Harness, Tools, and Root BUILD.gn
        run: |
          # 1. Parse Chromium Version accurately from key-value pairs
          MAJOR=$(grep 'CHROMIUM_MAJOR=' CHROMIUM_VERSION | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep 'CHROMIUM_MINOR=' CHROMIUM_VERSION | cut -d= -f2 | tr -d '[:space:]')
          BUILD=$(grep 'CHROMIUM_BUILD=' CHROMIUM_VERSION | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep 'CHROMIUM_PATCH=' CHROMIUM_VERSION | cut -d= -f2 | tr -d '[:space:]')
          CHROME_VER="${MAJOR}.${MINOR}.${BUILD}.${PATCH}"
          echo "Parsed Chromium Version: ${CHROME_VER}"

          # 2. Create the root .gn file pointing to the Chromium build configuration
          cat << 'EOF' > .gn
          buildconfig = "//build/config/BUILDCONFIG.gn"
          script_executable = "python3"
          default_args = {
            target_os = "android"
            target_cpu = "arm64"
          }
          EOF

          # 3. Sparse-checkout using --no-cone mode to allow single files (BUILD.gn) and directories
          echo "Checking out upstream Chromium build system..."
          git clone --depth 1 --filter=blob:none --no-checkout https://chromium.googlesource.com/chromium/src.git _upstream_chrome
          cd _upstream_chrome
          git fetch --depth 1 origin tag "${CHROME_VER}" || git fetch --depth 1 origin "${CHROME_VER}"
          git checkout FETCH_HEAD

          git sparse-checkout init --no-cone
          git sparse-checkout set "build/*" "buildtools/*" "tools/*" "BUILD.gn"
          git checkout

          # Copy files into project root
          cp -rn build ../ || true
          cp -rn buildtools ../ || true
          cp -rn tools ../ || true
          cp -n BUILD.gn ../ || true
          cd ..
          rm -rf _upstream_chrome

          # 4. Generate the missing gclient_args.gni file required by build/config/dcheck_always_on.gni
          mkdir -p build/config
          cat << 'EOF' > build/config/gclient_args.gni
          # Generated configuration file for Chromium GN build
          checkout_android = true
          checkout_android_native_support = true
          checkout_google_benchmark = false
          checkout_src_internal = false
          cros_boards = ""
          cros_boards_with_qemu_images = ""
          generate_location_tags = false
          EOF

      - name: Configure Build Output Directory
        run: |
          export PATH="/usr/local/bin:$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          mkdir -p out/AndroidRelease

          # Use Kiwi's production args if present, otherwise set baseline release args
          if [ -f ".build/production_build_reference/args.gn" ]; then
            cp .build/production_build_reference/args.gn out/AndroidRelease/args.gn
          else
            cat << 'EOF' > out/AndroidRelease/args.gn
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_official_build = true
          is_component_build = false
          symbol_level = 0
          blink_symbol_level = 0
          enable_nacl = false
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          EOF
          fi

          # Generate Ninja files
          /usr/local/bin/gn gen out/AndroidRelease

      - name: Compile chrome_public_apk via Ninja
        run: |
          export PATH="/usr/local/bin:$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          # Compile the APK target using available runner CPU cores
          ninja -C out/AndroidRelease chrome_public_apk -j $(nproc)

      - name: Locate and Package Output APK
        id: locate-apk
        run: |
          mkdir -p output_artifacts
          APK_PATH=$(find out/AndroidRelease -type f \( -name "*chrome_public*.apk" -o -name "*ChromePublic*.apk" -o -name "*out.apk" \) | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found compiled APK: $APK_PATH"
            cp "$APK_PATH" output_artifacts/KiwiFloatingBrowser-arm64.apk
            echo "apk_path=output_artifacts/KiwiFloatingBrowser-arm64.apk" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Listing all generated APKs if any:"
            find out/AndroidRelease -name "*.apk"
          fi

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KiwiFloatingBrowser-arm64
          path: output_artifacts/KiwiFloatingBrowser-arm64.apk
          retention-days: 14