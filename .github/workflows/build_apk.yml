name: 'Build Floating Multi-Tab Kiwi APK'

on:
  push:
    branches:
      - kiwi
      - master
      - main
  pull_request:
    branches:
      - kiwi
      - master
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build chrome_public_apk
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space (Aggressive Runner Cleanup)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /var/lib/docker
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Build Tools and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python-is-python3 \
            ninja-build \
            bison \
            gperf \
            pkg-config \
            libglib2.0-dev \
            libncurses5 \
            libxml2-dev \
            libxslt-dev

      - name: Install Google depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          # Bootstrap depot_tools to generate python3_bin_reldir.txt and initialize cipd
          bash $HOME/depot_tools/ensure_bootstrap
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Configure Build Output Directory
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          mkdir -p out/AndroidRelease

          if [ -f ".build/production_build_reference/args.gn" ]; then
            cp .build/production_build_reference/args.gn out/AndroidRelease/args.gn
          else
            cat << 'EOF' > out/AndroidRelease/args.gn
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_official_build = true
          is_component_build = false
          symbol_level = 0
          blink_symbol_level = 0
          enable_nacl = false
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          EOF
          fi

          # Prioritize the repository's native GN binary if available, otherwise use depot_tools gn
          if [ -f "buildtools/linux64/gn" ]; then
            chmod +x buildtools/linux64/gn
            ./buildtools/linux64/gn gen out/AndroidRelease
          elif command -v gn &> /dev/null; then
            gn gen out/AndroidRelease
          fi

      - name: Compile chrome_public_apk via Ninja
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          # Limit parallel jobs to available cores to prevent runner out-of-memory crashes
          ninja -C out/AndroidRelease chrome_public_apk -j $(nproc)

      - name: Locate and Package Output APK
        id: locate-apk
        run: |
          mkdir -p output_artifacts
          APK_PATH=$(find out/AndroidRelease -type f \( -name "*chrome_public*.apk" -o -name "*ChromePublic*.apk" -o -name "*out.apk" \) | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found compiled APK: $APK_PATH"
            cp "$APK_PATH" output_artifacts/KiwiFloatingBrowser-arm64.apk
            echo "apk_path=output_artifacts/KiwiFloatingBrowser-arm64.apk" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Listing all generated APKs if any:"
            find out/AndroidRelease -name "*.apk"
          fi

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KiwiFloatingBrowser-arm64
          path: output_artifacts/KiwiFloatingBrowser-arm64.apk
          retention-days: 14