name: 'Build Floating Multi-Tab Kiwi APK'

on:
  push:
    branches:
      - kiwi
      - master
      - main
  pull_request:
    branches:
      - kiwi
      - master
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kiwi Floating Browser APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Packaging Utilities & APKEditor
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl jq unzip python3

          # Download latest APKEditor by REAndroid (bypasses Apktool duplicate attribute bugs)
          APKEDITOR_URL=$(curl -sL https://api.github.com/repos/REAndroid/APKEditor/releases/latest | \
            jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          
          if [ -z "$APKEDITOR_URL" ] || [ "$APKEDITOR_URL" = "null" ]; then
            APKEDITOR_URL="https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar"
          fi

          echo "Downloading APKEditor from: $APKEDITOR_URL"
          curl -sL "$APKEDITOR_URL" -o /usr/local/bin/APKEditor.jar
          
          cat << 'EOF' > /usr/local/bin/apkeditor
          #!/bin/bash
          java -Xmx4096m -jar /usr/local/bin/APKEditor.jar "$@"
          EOF
          chmod +x /usr/local/bin/apkeditor

      - name: Download Base Kiwi APK
        run: |
          mkdir -p base_apk
          echo "Fetching official Kiwi Browser arm64 release APK..."

          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/kiwibrowser/src.next/releases | \
            jq -r '.[0].assets[] | select(.name | contains("arm64") and endswith(".apk")) | .browser_download_url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/kiwibrowser/src.next/releases/latest | \
              jq -r '.assets[] | select(.name | contains("arm64") and endswith(".apk")) | .browser_download_url' | head -n 1)
          fi

          echo "Downloading base APK from: $DOWNLOAD_URL"
          curl -sL "$DOWNLOAD_URL" -o base_apk/kiwi_base.apk
          ls -lh base_apk/kiwi_base.apk

      - name: Decompile APK via APKEditor
        run: |
          apkeditor d -i base_apk/kiwi_base.apk -o apk_workspace
          echo "APK extracted cleanly with APKEditor."

      - name: Apply Floating Window & Multi-Tab Overlay Modifications
        run: |
          mkdir -p apk_workspace/root/res/layout
          mkdir -p apk_workspace/root/res/values

          # 1. Copy floating_tabs_bar.xml
          if [ -f "chrome/android/java/res/layout/floating_tabs_bar.xml" ]; then
            cp "chrome/android/java/res/layout/floating_tabs_bar.xml" apk_workspace/root/res/layout/
            echo "Copied floating_tabs_bar.xml"
          fi

          # 2. Copy control_container.xml
          if [ -f "chrome/browser/ui/android/toolbar/java/res/layout/control_container.xml" ]; then
            cp "chrome/browser/ui/android/toolbar/java/res/layout/control_container.xml" apk_workspace/root/res/layout/
            echo "Copied control_container.xml"
          elif [ -f "chrome/android/java/res/layout/control_container.xml" ]; then
            cp "chrome/android/java/res/layout/control_container.xml" apk_workspace/root/res/layout/
            echo "Copied control_container.xml"
          fi

          # 3. Add Theme.Chromium.Floating into styles.xml using safe XML parsing
          python3 -c '
          import os, glob

          # Find styles.xml in decompiled root
          styles_files = glob.glob("apk_workspace/**/values/styles.xml", recursive=True)
          if not styles_files:
              styles_files = ["apk_workspace/root/res/values/styles.xml"]

          style_snippet = """
              <!-- Floating Freeform Multi-Tab Overlay Theme -->
              <style name="Theme.Chromium.Floating" parent="Theme.Chromium.Activity">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:backgroundDimEnabled">false</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
              </style>
          </resources>"""

          for path in styles_files:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  if "Theme.Chromium.Floating" not in content:
                      content = content.replace("</resources>", style_snippet)
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"Injected Theme.Chromium.Floating into {path}")
          '

          # 4. Patch AndroidManifest.xml properly with correct namespace binding
          python3 -c '
          import os, glob
          import xml.etree.ElementTree as ET

          manifest_files = glob.glob("apk_workspace/**/AndroidManifest.xml", recursive=True)
          if not manifest_files:
              manifest_files = ["apk_workspace/root/AndroidManifest.xml"]

          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)

          for manifest_path in manifest_files:
              if not os.path.exists(manifest_path):
                  continue

              tree = ET.parse(manifest_path)
              root = tree.getroot()

              # Add uses-permission for SYSTEM_ALERT_WINDOW if missing
              has_permission = False
              for perm in root.findall("uses-permission"):
                  if perm.attrib.get(f"{{{ANDROID_NS}}}name") == "android.permission.SYSTEM_ALERT_WINDOW":
                      has_permission = True
                      break

              if not has_permission:
                  new_perm = ET.Element("uses-permission")
                  new_perm.set(f"{{{ANDROID_NS}}}name", "android.permission.SYSTEM_ALERT_WINDOW")
                  root.insert(0, new_perm)
                  print("Added android.permission.SYSTEM_ALERT_WINDOW")

              # Update ChromeTabbedActivity theme to Theme.Chromium.Floating
              app = root.find("application")
              if app is not None:
                  for activity in app.findall("activity"):
                      act_name = activity.attrib.get(f"{{{ANDROID_NS}}}name", "")
                      if "ChromeTabbedActivity" in act_name:
                          activity.set(f"{{{ANDROID_NS}}}theme", "@style/Theme.Chromium.Floating")
                          activity.set(f"{{{ANDROID_NS}}}resizeableActivity", "true")
                          print(f"Updated {act_name} to Theme.Chromium.Floating")

              tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
              print(f"Manifest saved: {manifest_path}")
          '

      - name: Rebuild Modified APK via APKEditor
        run: |
          apkeditor b -i apk_workspace -o unsigned_modified.apk
          ls -lh unsigned_modified.apk

      - name: Align and Sign APK
        run: |
          mkdir -p output_artifacts

          # Zipalign the rebuilt APK
          zipalign -p -f -v 4 unsigned_modified.apk output_artifacts/KiwiFloatingBrowser-unaligned.apk

          # Generate debug signing keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Sign APK with apksigner (v1, v2, and v3 schemes)
          apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output_artifacts/KiwiFloatingBrowser-arm64.apk \
            output_artifacts/KiwiFloatingBrowser-unaligned.apk

          echo "Final APK signed and verified successfully:"
          apksigner verify output_artifacts/KiwiFloatingBrowser-arm64.apk
          ls -lh output_artifacts/KiwiFloatingBrowser-arm64.apk

      - name: Upload Floating Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: KiwiFloatingBrowser-arm64
          path: output_artifacts/KiwiFloatingBrowser-arm64.apk
          retention-days: 14