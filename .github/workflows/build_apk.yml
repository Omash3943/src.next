name: 'Build Floating Multi-Tab Kiwi APK'

on:
  push:
    branches:
      - kiwi
      - master
      - main
  pull_request:
    branches:
      - kiwi
      - master
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kiwi Floating Browser APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Packaging Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl jq unzip python3

          # Install latest standalone Apktool
          curl -sL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | \
            jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | \
            head -n 1 | xargs -I {} curl -sL {} -o /usr/local/bin/apktool.jar

          cat << 'EOF' > /usr/local/bin/apktool
          #!/bin/bash
          java -Xmx4096m -jar /usr/local/bin/apktool.jar "$@"
          EOF
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Download Base Kiwi APK
        run: |
          mkdir -p base_apk
          echo "Fetching official Kiwi Browser arm64 release APK..."

          # Fetch download URL of the latest arm64 APK from Kiwi releases
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/kiwibrowser/src.next/releases | \
            jq -r '.[0].assets[] | select(.name | contains("arm64") and endswith(".apk")) | .browser_download_url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "API lookup fallback: querying releases list..."
            DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/kiwibrowser/src.next/releases/latest | \
              jq -r '.assets[] | select(.name | contains("arm64") and endswith(".apk")) | .browser_download_url' | head -n 1)
          fi

          echo "Downloading base APK from: $DOWNLOAD_URL"
          curl -sL "$DOWNLOAD_URL" -o base_apk/kiwi_base.apk
          ls -lh base_apk/kiwi_base.apk

      - name: Unpack Base APK Resources
        run: |
          # -s (--no-src) skips disassembling dex to smali, decoding only XML and resources for maximum reliability and speed
          apktool d -f -s base_apk/kiwi_base.apk -o apk_workspace
          echo "APK resources extracted successfully."

      - name: Apply Floating Window & Multi-Tab Overlay Modifications
        run: |
          mkdir -p apk_workspace/res/layout
          mkdir -p apk_workspace/res/values

          # 1. Copy floating_tabs_bar.xml layout
          if [ -f "chrome/android/java/res/layout/floating_tabs_bar.xml" ]; then
            cp "chrome/android/java/res/layout/floating_tabs_bar.xml" apk_workspace/res/layout/
            echo "Copied floating_tabs_bar.xml"
          fi

          # 2. Copy control_container.xml layout
          if [ -f "chrome/browser/ui/android/toolbar/java/res/layout/control_container.xml" ]; then
            cp "chrome/browser/ui/android/toolbar/java/res/layout/control_container.xml" apk_workspace/res/layout/
            echo "Copied control_container.xml"
          elif [ -f "chrome/android/java/res/layout/control_container.xml" ]; then
            cp "chrome/android/java/res/layout/control_container.xml" apk_workspace/res/layout/
            echo "Copied control_container.xml"
          fi

          # 3. Add Theme.Chromium.Floating into styles.xml
          python3 -c '
          import os

          styles_path = "apk_workspace/res/values/styles.xml"
          if os.path.exists(styles_path):
              with open(styles_path, "r", encoding="utf-8") as f:
                  content = f.read()

              style_snippet = """
                  <!-- Floating Freeform Multi-Tab Overlay Theme -->
                  <style name="Theme.Chromium.Floating" parent="Theme.Chromium.Activity">
                      <item name="android:windowBackground">@android:color/transparent</item>
                      <item name="android:windowIsTranslucent">true</item>
                      <item name="android:windowNoTitle">true</item>
                      <item name="android:windowAnimationStyle">@null</item>
                      <item name="android:backgroundDimEnabled">false</item>
                      <item name="android:colorBackgroundCacheHint">@null</item>
                      <item name="windowNoTitle">true</item>
                      <item name="windowActionBar">false</item>
                  </style>
              </resources>"""

              if "Theme.Chromium.Floating" not in content:
                  content = content.replace("</resources>", style_snippet)
                  with open(styles_path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Injected Theme.Chromium.Floating into styles.xml")
          '

          # 4. Patch AndroidManifest.xml for SYSTEM_ALERT_WINDOW, Theme.Chromium.Floating, and Freeform
          python3 -c '
          with open("apk_workspace/AndroidManifest.xml", "r", encoding="utf-8") as f:
              manifest = f.read()

          # Add SYSTEM_ALERT_WINDOW permission
          if "android.permission.SYSTEM_ALERT_WINDOW" not in manifest:
              manifest = manifest.replace(
                  "<application",
                  "<uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>\n    <application"
              )

          # Switch ChromeTabbedActivity to Theme.Chromium.Floating
          manifest = manifest.replace(
              "Theme.Chromium.TabbedMode",
              "Theme.Chromium.Floating"
          )

          with open("apk_workspace/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest)
          print("Patched AndroidManifest.xml successfully.")
          '

      - name: Rebuild Modified APK
        run: |
          apktool b apk_workspace -o unsigned_modified.apk
          ls -lh unsigned_modified.apk

      - name: Align and Sign APK
        run: |
          mkdir -p output_artifacts

          # Zipalign the rebuilt APK
          zipalign -p -f -v 4 unsigned_modified.apk output_artifacts/KiwiFloatingBrowser-unaligned.apk

          # Generate debug signing keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Sign APK with apksigner (v1, v2, and v3 schemes)
          apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output_artifacts/KiwiFloatingBrowser-arm64.apk \
            output_artifacts/KiwiFloatingBrowser-unaligned.apk

          echo "Final APK signed and verified successfully:"
          apksigner verify output_artifacts/KiwiFloatingBrowser-arm64.apk
          ls -lh output_artifacts/KiwiFloatingBrowser-arm64.apk

      - name: Upload Floating Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: KiwiFloatingBrowser-arm64
          path: output_artifacts/KiwiFloatingBrowser-arm64.apk
          retention-days: 14