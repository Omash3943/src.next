name: 'Build Floating Multi-Tab Kiwi APK'

on:
  push:
    branches:
      - kiwi
      - master
      - main
  pull_request:
    branches:
      - kiwi
      - master
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kiwi Floating Browser APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Android SDK & Build-Tools
        uses: android-actions/setup-android@v3

      - name: Install Packaging Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl jq unzip

          # Install latest Apktool
          curl -sL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | \
            jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | \
            head -n 1 | xargs -I {} curl -sL {} -o /usr/local/bin/apktool.jar
          
          cat << 'EOF' > /usr/local/bin/apktool
          #!/bin/bash
          java -Xmx4096m -jar /usr/local/bin/apktool.jar "$@"
          EOF
          chmod +x /usr/local/bin/apktool

      - name: Download Base Kiwi APK
        run: |
          mkdir -p base_apk
          echo "Fetching latest official Kiwi Browser arm64 release APK..."
          
          # Query GitHub API for the latest release asset matching arm64
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/kiwibrowser/src.next/releases | \
            jq -r '.[0].assets[] | select(.name | contains("arm64") and endswith(".apk")) | .browser_download_url' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            # Fallback to direct release CDN mirror if API list is empty
            DOWNLOAD_URL="https://github.com/kiwibrowser/src.next/releases/download/105.0.5195.24/com.kiwibrowser.browser-arm64.apk"
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          curl -sL "$DOWNLOAD_URL" -o base_apk/kiwi_base.apk
          ls -lh base_apk/kiwi_base.apk

      - name: Unpack Base APK
        run: |
          apktool d -f -r base_apk/kiwi_base.apk -o apk_workspace
          echo "APK successfully extracted into workspace."

      - name: Apply Floating Window & Multi-Tab Overlay Modifications
        run: |
          # 1. Overlay new and modified layouts and styles
          mkdir -p apk_workspace/res/layout
          mkdir -p apk_workspace/res/values

          # Copy floating_tabs_bar.xml
          if [ -f "chrome/android/java/res/layout/floating_tabs_bar.xml" ]; then
            cp "chrome/android/java/res/layout/floating_tabs_bar.xml" apk_workspace/res/layout/
          fi

          # Copy control_container.xml
          if [ -f "chrome/browser/ui/android/toolbar/java/res/layout/control_container.xml" ]; then
            cp "chrome/browser/ui/android/toolbar/java/res/layout/control_container.xml" apk_workspace/res/layout/
          fi

          # 2. Add Theme.Chromium.Floating to styles.xml
          if [ -f "apk_workspace/res/values/styles.xml" ]; then
            python3 -c '
          import re

          style_snippet = """
              <!-- Floating Freeform Multi-Tab Overlay Theme -->
              <style name="Theme.Chromium.Floating" parent="Theme.Chromium.Activity">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:backgroundDimEnabled">false</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
              </style>
          </resources>"""

          with open("apk_workspace/res/values/styles.xml", "r", encoding="utf-8") as f:
              content = f.read()

          if "Theme.Chromium.Floating" not in content:
              content = content.replace("</resources>", style_snippet)
              with open("apk_workspace/res/values/styles.xml", "w", encoding="utf-8") as f:
                  f.write(content)
              print("Theme.Chromium.Floating injected into styles.xml")
          '
          fi

          # 3. Patch AndroidManifest.xml with SYSTEM_ALERT_WINDOW and Floating theme
          python3 -c '
          with open("apk_workspace/AndroidManifest.xml", "r", encoding="utf-8") as f:
              manifest = f.read()

          # Add permission if missing
          if "android.permission.SYSTEM_ALERT_WINDOW" not in manifest:
              manifest = manifest.replace(
                  "<application",
                  "<uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>\n    <application"
              )

          # Update ChromeTabbedActivity theme to Floating
          manifest = manifest.replace(
              "android:name=\"org.chromium.chrome.browser.ChromeTabbedActivity\"\n            android:theme=\"@style/Theme.Chromium.TabbedMode\"",
              "android:name=\"org.chromium.chrome.browser.ChromeTabbedActivity\"\n            android:theme=\"@style/Theme.Chromium.Floating\""
          )
          manifest = manifest.replace(
              "android:name=\"org.chromium.chrome.browser.ChromeTabbedActivity\" android:theme=\"@style/Theme.Chromium.TabbedMode\"",
              "android:name=\"org.chromium.chrome.browser.ChromeTabbedActivity\" android:theme=\"@style/Theme.Chromium.Floating\""
          )

          with open("apk_workspace/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest)
          print("AndroidManifest.xml patched successfully.")
          '

      - name: Rebuild Modified APK
        run: |
          apktool b apk_workspace -o unsigned_modified.apk
          ls -lh unsigned_modified.apk

      - name: Align and Sign APK
        run: |
          mkdir -p output_artifacts
          
          # Zipalign the rebuilt APK
          zipalign -p -f -v 4 unsigned_modified.apk output_artifacts/KiwiFloatingBrowser-unaligned.apk
          
          # Generate build keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Sign APK with apksigner
          apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output_artifacts/KiwiFloatingBrowser-arm64.apk \
            output_artifacts/KiwiFloatingBrowser-unaligned.apk

          echo "Final APK signed successfully:"
          ls -lh output_artifacts/KiwiFloatingBrowser-arm64.apk

      - name: Upload Floating Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: KiwiFloatingBrowser-arm64
          path: output_artifacts/KiwiFloatingBrowser-arm64.apk
          retention-days: 14