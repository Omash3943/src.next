name: 'Build Floating Multi-Tab Kiwi APK'

on:
  push:
    branches:
      - kiwi
      - master
      - main
  pull_request:
    branches:
      - kiwi
      - master
      - main
  workflow_dispatch:

concurrency:
  group: build-kiwi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kiwi Floating Browser APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Packaging Utilities & APKEditor
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl jq unzip python3

          # Download APKEditor V1.4.9
          curl -sL "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar" -o /usr/local/bin/APKEditor.jar
          
          cat << 'EOF' > /usr/local/bin/apkeditor
          #!/bin/bash
          java -Xmx4096m -jar /usr/local/bin/APKEditor.jar "$@"
          EOF
          chmod +x /usr/local/bin/apkeditor

      - name: Download Official Kiwi Base APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base_apk
          echo "Downloading authentic Kiwi Browser arm64 release binary..."

          gh release download --repo kiwibrowser/src.next --pattern "*arm64*github.apk" --dir base_apk || \
          gh release download --repo kiwibrowser/src.next --pattern "*arm64*.apk" --dir base_apk

          FOUND_APK=$(find base_apk -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -s "$FOUND_APK" ]; then
            echo "ERROR: Failed to download official APK binary from Kiwi releases."
            exit 1
          fi

          mv "$FOUND_APK" base_apk/kiwi_base.apk
          ls -lh base_apk/kiwi_base.apk

          # Verify integrity
          unzip -t base_apk/kiwi_base.apk | head -n 5

      - name: Decompile APK via APKEditor (Using -t json for Obfuscated Resources)
        run: |
          # Use -t json to handle obfuscated resources and -dex to keep raw bytecode
          apkeditor d -t json -dex -i base_apk/kiwi_base.apk -o apk_workspace
          echo "APK extracted cleanly in JSON resource mode."

      - name: Apply Floating Window & Multi-Tab Overlay Modifications
        run: |
          # 1. Embed Floating Tabs Dock Bar directly into control_container.xml
          python3 -c '
          import os, glob

          dock_view = """
          <!-- Embedded Pinned Floating Multi-Tab Dock Bar -->
          <LinearLayout
              android:id="@+id/floating_tabs_bar_container"
              android:layout_width="match_parent"
              android:layout_height="38dp"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:background="#E6202124"
              android:paddingStart="6dp"
              android:paddingEnd="6dp"
              android:clickable="true"
              android:focusable="true">

              <LinearLayout
                  android:id="@+id/floating_drag_handle"
                  android:layout_width="wrap_content"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:paddingStart="4dp"
                  android:paddingEnd="8dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⠿"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/floating_tab_pills_container"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/floating_tab_1"
                      android:layout_width="0dp"
                      android:layout_height="28dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:gravity="center"
                      android:text="1"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:background="#33FFFFFF" />

                  <TextView
                      android:id="@+id/floating_tab_2"
                      android:layout_width="0dp"
                      android:layout_height="28dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:gravity="center"
                      android:text="2"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:background="#33FFFFFF" />

                  <TextView
                      android:id="@+id/floating_tab_3"
                      android:layout_width="0dp"
                      android:layout_height="28dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:gravity="center"
                      android:text="3"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:background="#33FFFFFF" />

                  <TextView
                      android:id="@+id/floating_tab_4"
                      android:layout_width="0dp"
                      android:layout_height="28dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:gravity="center"
                      android:text="4"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:background="#33FFFFFF" />

                  <TextView
                      android:id="@+id/floating_tab_5"
                      android:layout_width="0dp"
                      android:layout_height="28dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:gravity="center"
                      android:text="5"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:background="#33FFFFFF" />

                  <TextView
                      android:id="@+id/floating_tab_6"
                      android:layout_width="0dp"
                      android:layout_height="28dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:gravity="center"
                      android:text="6"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:background="#33FFFFFF" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/floating_action_buttons_container"
                  android:layout_width="wrap_content"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:orientation="horizontal"
                  android:paddingStart="6dp">

                  <TextView
                      android:id="@+id/floating_min_btn"
                      android:layout_width="30dp"
                      android:layout_height="28dp"
                      android:layout_marginEnd="3dp"
                      android:gravity="center"
                      android:text="—"
                      android:textSize="14sp"
                      android:textStyle="bold"
                      android:textColor="#CCCCCC" />

                  <TextView
                      android:id="@+id/floating_close_btn"
                      android:layout_width="30dp"
                      android:layout_height="28dp"
                      android:gravity="center"
                      android:text="✕"
                      android:textSize="14sp"
                      android:textStyle="bold"
                      android:textColor="#FF5252" />
              </LinearLayout>
          </LinearLayout>
          """

          cc_files = glob.glob("apk_workspace/**/layout/control_container.xml", recursive=True)
          for cc in cc_files:
              with open(cc, "r", encoding="utf-8") as f:
                  content = f.read()
              if "floating_tabs_bar_container" not in content and "id/toolbar_container" in content:
                  target = "id/toolbar_container\""
                  idx = content.find(target)
                  tag_end = content.find(">", idx) + 1
                  content = content[:tag_end] + "\n" + dock_view + content[tag_end:]
                  with open(cc, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Dock bar embedded into {cc}")
          '

          # 2. Patch AndroidManifest.xml: set FakeTranslucent theme, SYSTEM_ALERT_WINDOW, and resizeableActivity
          python3 -c '
          import os, glob
          import xml.etree.ElementTree as ET

          manifest_files = glob.glob("apk_workspace/**/AndroidManifest.xml", recursive=True)
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)

          for manifest_path in manifest_files:
              tree = ET.parse(manifest_path)
              root = tree.getroot()

              has_perm = any(p.attrib.get(f"{{{ANDROID_NS}}}name") == "android.permission.SYSTEM_ALERT_WINDOW" for p in root.findall("uses-permission"))
              if not has_perm:
                  new_perm = ET.Element("uses-permission")
                  new_perm.set(f"{{{ANDROID_NS}}}name", "android.permission.SYSTEM_ALERT_WINDOW")
                  root.insert(0, new_perm)
                  print("Added android.permission.SYSTEM_ALERT_WINDOW")

              app = root.find("application")
              if app is not None:
                  for act in app.findall("activity"):
                      act_name = act.attrib.get(f"{{{ANDROID_NS}}}name", "")
                      if "ChromeTabbedActivity" in act_name:
                          act.set(f"{{{ANDROID_NS}}}resizeableActivity", "true")
                          # Use the built-in translucent theme present in Kiwi resources
                          act.set(f"{{{ANDROID_NS}}}theme", "@style/Theme.Chromium.Activity.FakeTranslucent")
                          print(f"Configured {act_name} with FakeTranslucent theme & resizeableActivity")

              tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
              print(f"Manifest updated: {manifest_path}")
          '

      - name: Rebuild Modified APK via APKEditor
        run: |
          apkeditor b -i apk_workspace -o unsigned_modified.apk
          ls -lh unsigned_modified.apk

      - name: Align and Sign APK
        run: |
          mkdir -p output_artifacts

          # Zipalign the rebuilt APK
          zipalign -p -f -v 4 unsigned_modified.apk output_artifacts/KiwiFloatingBrowser-unaligned.apk

          # Generate debug signing keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Sign APK with apksigner (v1, v2, and v3 schemes)
          apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output_artifacts/KiwiFloatingBrowser-arm64.apk \
            output_artifacts/KiwiFloatingBrowser-unaligned.apk

          echo "Final APK signed and verified successfully:"
          apksigner verify output_artifacts/KiwiFloatingBrowser-arm64.apk
          ls -lh output_artifacts/KiwiFloatingBrowser-arm64.apk

      - name: Upload Floating Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: KiwiFloatingBrowser-arm64
          path: output_artifacts/KiwiFloatingBrowser-arm64.apk
          retention-days: 14